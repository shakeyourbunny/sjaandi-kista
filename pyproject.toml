[project]
name = "kista"
version = "0.1.0"
description = "House toolchest: shared modules for the Projects family"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "bandit",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kista"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
