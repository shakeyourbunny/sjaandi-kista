[project]
name = "sjaandi-kista"
dynamic = ["version"]
description = "House toolchest: shared modules for the Projects family"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "requests",
    "pathvalidate",
    "brotli",
]

[project.optional-dependencies]
cache = [
    "requests-cache",
]
slugify = [
    "unidecode",
]
dev = [
    "pytest",
    "ruff",
    "bandit",
    "requests-cache",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kista"]

[tool.setuptools.dynamic]
version = {attr = "kista.__version__"}

[tool.setuptools.package-data]
kista = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
